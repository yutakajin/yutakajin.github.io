<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユタカジン | 自分らしい時間的豊かさを追求するマガジン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="amazon-header">
        <div class="header-left">
            <a href="#" class="brand-logo">ユタカジン</a>
            <span class="header-desc">自分らしい時間的豊かさを追求するマガジン</span>
        </div>
        <!-- Search Bar Removed -->
        <div class="header-right">
            <a href="https://note.com/taskchute/m/m80cde2fde6bf" class="nav-link">Noteで読む</a>
        </div>
    </header>

    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section author-section">
                <button id="author-toggle-btn" class="author-toggle-btn" type="button" aria-expanded="false">
                    <span class="btn-text">執筆者一覧を見る</span>
                    <span class="toggle-icon">▼</span>
                </button>
                <h3 class="sidebar-title author-title">執筆者</h3>
                <div class="sidebar-authors" id="author-list">
                    <!-- Injected by JS -->
                </div>
            </div>

            <!-- Tag Section -->
            <div class="sidebar-section tag-section">
                <button id="tag-toggle-btn" class="tag-toggle-btn author-toggle-btn" type="button" aria-expanded="false">
                    <span class="btn-text">🏷️ 内容別タグを見る</span>
                    <span class="toggle-icon">▼</span>
                </button>
                <h3 class="sidebar-title tag-title">🏷️ 内容別タグ</h3>
                <div class="sidebar-tags" id="tag-cloud">
                    <!-- Injected by JS -->
                </div>
            </div>

            <div class="sidebar-section concept-section">
                <h3 class="sidebar-title">コンセプト</h3>
                <p class="sidebar-text">「時間がない」毎日から、あなたらしい豊かな時間へ。</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Recommendation Header -->
            <section class="results-header">
                <h2>今のあなたにオススメ</h2>
                <span class="results-count">Recommended for You</span>
            </section>

            <!-- Recommendation Banner -->
            <section id="recommendation-banner" class="recommendation-banner">
                <!-- Injected by JS -->
            </section>

            <!-- Category & Content Filter Section -->
            <section class="category-nav-section">
                <div class="category-tabs" id="category-tabs">
                    <!-- Injected by JS -->
                </div>
            </section>

            <!-- Active Filter Bar -->
            <div id="active-filter-bar" class="active-filter-bar" style="display: none;">
                <div class="filter-status-info">
                    <span id="active-filter-label" class="active-filter-label"></span>
                    <span id="active-filter-count" class="active-filter-count"></span>
                </div>
                <button id="reset-filter-btn" class="reset-filter-btn" type="button">✕ 絞り込み解除</button>
            </div>

            <section class="results-header">
                <h2 id="results-title">最近の記事</h2>
                <span class="results-count" id="results-subtitle">All Articles</span>
            </section>

            <div id="articles-grid" class="amazon-grid">
                <!-- Injected by JS -->
            </div>

            <!-- Load More Button -->
            <div id="load-more-container" class="load-more-container">
                <button id="load-more-btn" class="load-more-btn" type="button">もっと記事を見る（残り <span id="remaining-count">0</span> 件）</button>
            </div>
        </main>
    </div>

    <footer class="amazon-footer">
        <div class="footer-top">
            <a href="#">トップへ戻る</a>
        </div>
        <div class="footer-content">
            <div class="footer-col">
                <h3>ユタカジンについて</h3>
                <a href="#">コンセプト</a>
                <a href="#">執筆者一覧</a>
            </div>
            <div class="footer-col">
                <h3>Follow Us</h3>
                <a href="https://note.com/taskchute/m/m80cde2fde6bf">Note</a>
                <a href="#">Twitter</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Unitajin Promo.</p>
        </div>
    </footer>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
